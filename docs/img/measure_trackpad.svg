<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" font-size="24" fill="#2c3e50" text-anchor="start" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">图 2  Magic Trackpad（USB-C 版，单位 mm）</text><text x="90" y="85" font-size="18" fill="#2c3e50" text-anchor="start" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">(a) 俯视：最薄的一边朝向你</text><rect x="90" y="130" width="520" height="380" rx="30" fill="#f4f4f4" stroke="#222" stroke-width="2"/><line x1="90" y1="110" x2="610" y2="110" stroke="#c0392b" stroke-width="2"/><polygon points="90,110 99.21060994002885,113.8941834230865 99.21060994002885,106.1058165769135" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="610,110 600.7893900599712,106.1058165769135 600.7893900599712,113.8941834230865" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="350.0" y="102.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T1 宽</text><line x1="650" y1="130" x2="650" y2="510" stroke="#c0392b" stroke-width="2"/><polygon points="650,130 646.1058165769135,139.21060994002886 653.8941834230865,139.21060994002886" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="650,510 653.8941834230865,500.78939005997114 646.1058165769135,500.78939005997114" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="688.0" y="326.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T2 深</text><text x="350.0" y="544" font-size="16" fill="#2c3e50" text-anchor="middle" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">前（最薄的一边，靠近你）</text><text x="350.0" y="320.0" font-size="15" fill="#7f8c8d" text-anchor="middle" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">量底面的外形（玻璃面可能略小）</text><text x="80" y="370.0" font-size="16" fill="#2c3e50" text-anchor="end" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">左</text><text x="120" y="580" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">T5 圆角：同图 1 的 K5 描图法，量 d。</text><text x="760" y="85" font-size="18" fill="#2c3e50" text-anchor="start" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">(b) 侧视</text><line x1="740" y1="280" x2="1300" y2="280" stroke="#999" stroke-width="2"/><polygon points="760,280 1260,280 1260,170 760,230" fill="#f4f4f4" stroke="#222" stroke-width="2"/><line x1="740" y1="280" x2="740" y2="230" stroke="#c0392b" stroke-width="2"/><polygon points="740,280 743.8941834230865,270.78939005997114 736.1058165769135,270.78939005997114" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="740,230 736.1058165769135,239.21060994002886 743.8941834230865,239.21060994002886" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="784.0" y="261.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T3 前厚</text><line x1="1290" y1="280" x2="1290" y2="170" stroke="#c0392b" stroke-width="2"/><polygon points="1290,280 1293.8941834230866,270.78939005997114 1286.1058165769134,270.78939005997114" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="1290,170 1286.1058165769134,179.21060994002886 1293.8941834230866,179.21060994002886" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="1246.0" y="231.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T4 后厚</text><text x="760" y="315" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">前</text><text x="1260" y="315" font-size="15" fill="#2c3e50" text-anchor="end" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">后</text><text x="760" y="400" font-size="18" fill="#2c3e50" text-anchor="start" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">(c) 后视（T6–T8）</text><rect x="760" y="430" width="520" height="80" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/><line x1="740" y1="510" x2="1300" y2="510" stroke="#999" stroke-width="2"/><rect x="920" y="464" width="40" height="16" rx="8" fill="#555" stroke="#222" stroke-width="2"/><rect x="790" y="464" width="34" height="14" rx="3" fill="#999" stroke="#222" stroke-width="2"/><text x="940" y="456" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">USB-C</text><text x="807" y="456" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">开关</text><text x="1280" y="424" font-size="14" fill="#2c3e50" text-anchor="end" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">从后面看时，正面的左边在右边 →</text><line x1="1280" y1="545" x2="940" y2="545" stroke="#c0392b" stroke-width="2"/><polygon points="1280,545 1270.789390059971,541.1058165769135 1270.789390059971,548.8941834230865" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="940,545 949.2106099400288,548.8941834230865 949.2106099400288,541.1058165769135" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="1110.0" y="531.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T6a 到正面看的左边</text><line x1="760" y1="545" x2="940" y2="545" stroke="#c0392b" stroke-width="2"/><polygon points="760,545 769.2106099400288,548.8941834230865 769.2106099400288,541.1058165769135" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="940,545 930.7893900599712,541.1058165769135 930.7893900599712,548.8941834230865" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="850.0" y="571.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T6b 到另一边</text><line x1="990" y1="510" x2="990" y2="472" stroke="#c0392b" stroke-width="2"/><polygon points="990,510 993.8941834230865,500.78939005997114 986.1058165769135,500.78939005997114" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><polygon points="990,472 986.1058165769135,481.21060994002886 993.8941834230865,481.21060994002886" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="968.0" y="497.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">T7</text><text x="760" y="595" font-size="14" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">开关（T8）也量两边的距离。</text><text x="90" y="700" font-size="18" fill="#2c3e50" text-anchor="start" font-weight="bold" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">(d) 底面：脚垫 / 凸起（键盘 K17 同样要量）</text><rect x="90" y="720" width="340" height="150" rx="20" fill="#f4f4f4" stroke="#222" stroke-width="2"/><rect x="108" y="737" width="24" height="16" rx="8" fill="#888" stroke="#222" stroke-width="2"/><rect x="378" y="737" width="24" height="16" rx="8" fill="#888" stroke="#222" stroke-width="2"/><rect x="108" y="832" width="24" height="16" rx="8" fill="#888" stroke="#222" stroke-width="2"/><rect x="378" y="832" width="24" height="16" rx="8" fill="#888" stroke="#222" stroke-width="2"/><text x="460" y="760" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">把设备翻过来，对每一个脚垫 / 凸起记下：</text><text x="460" y="786" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">· 中心到【正面看的左边】的距离、到前边的距离</text><text x="460" y="812" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">· 大小（直径，或长 × 宽）</text><text x="460" y="838" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">· 凸出底面的高度（如果是平的就写 0）</text><text x="460" y="864" font-size="15" fill="#2c3e50" text-anchor="start" font-weight="normal" font-family="WenQuanYi Zen Hei, Noto Sans CJK SC, sans-serif">拍一张带尺子的底面照片最保险。</text></svg>